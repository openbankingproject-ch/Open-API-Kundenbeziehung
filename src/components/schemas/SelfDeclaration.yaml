title: Self declaration
description: Self declaration of the customer on beneficial ownership, tax residency and source of funds (FATCA / CRS / AML).
type: object
required:
  - economicBeneficiary
  - fatcaDeclaration
  - nationalityList
  - sourceOfFunds
  - taxComplianceDeclaration
  - taxDomicile
  - usTaxLiability
properties:
  economicBeneficiary:
    description: Whether the customer is the economic beneficiary (acting on their own behalf).
    type: boolean
    examples:
      - true
  fatcaDeclaration:
    description: FATCA declaration of the customer.
    type: object
    required:
      - confirmed
      - status
    properties:
      confirmed:
        description: Whether the customer has explicitly confirmed their FATCA status.
        type: boolean
        examples:
          - true
      status:
        description: Customer's FATCA classification.
        type: string
        enum:
          - non_us_person
          - us_person
          - recalcitrant
        examples:
          - non_us_person
  nationalityList:
    description: All nationalities held by the customer as ISO 3166-1 alpha-2 codes. The first entry represents the main nationality.
    type: array
    items:
      type: string
      pattern: ^[A-Z]{2}$
      examples:
        - CH
        - DE
  sourceOfFunds:
    description: Primary origin of funds for AML risk assessment per FINMA guidelines.
    type: string
    enum:
      - employment
      - business
      - investment
      - inheritance
      - savings
      - gift
      - real_estate
      - other
    examples:
      - employment
  taxComplianceDeclaration:
    description: Declaration of the customer on compliance with applicable tax laws.
    type: object
    required:
      - confirmed
      - declarationDate
    properties:
      confirmed:
        description: Whether the customer has confirmed compliance with all applicable tax laws.
        type: boolean
        examples:
          - true
      declarationDate:
        description: ISO 8601 timestamp of when the declaration was confirmed.
        type: string
        format: date-time
        examples:
          - '2024-03-15T09:38:00Z'
  taxDomicile:
    description: ISO 3166-1 alpha-2 country code of primary tax residency.
    type: string
    pattern: ^[A-Z]{2}$
    examples:
      - CH
  usTaxLiability:
    description: Whether the customer has a US tax obligation triggering FATCA reporting.
    type: boolean
    examples:
      - false
  tin:
    description: Tax Identification Number for the declared tax domicile (e.g. AHV/AVS for CH).
    type: string
    examples:
      - 756.1234.5678.97
