type: object
required:
  - addressType
  - streetName
  - buildingNumber
  - postCode
  - townName
  - country
properties:
  addressType:
    type: string
    description: Address type identifier (e.g. residential).
  streetName:
    type: string
    maxLength: 35
    description: Name of the street or thoroughfare.
  buildingNumber:
    type: string
    maxLength: 35
    description: Number that identifies the position of the building on a street (text to accommodate formats like 12a, 3/4).
  postCode:
    type: string
    maxLength: 35
    description: Postal code added to a postal address to assist the sorting of mail.
  townName:
    type: string
    maxLength: 35
    description: Name of the town or city.
  country:
    type: string
    pattern: '^[A-Z]{2}$'
    description: ISO 3166-1 alpha-2 country code.
  countrySubDivision:
    type: string
    maxLength: 35
    description: Subdivision of a country such as canton (CH), federal state (DE), region, or county.
  validFrom:
    type: string
    format: date
    description: Date from which the customer has resided at this address (YYYY-MM-DD).
  validTo:
    type: string
    format: date
    description: Date until which the customer resided here. Empty means current address.
