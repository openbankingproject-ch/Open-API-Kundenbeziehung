title: Signature
description: Electronic signature of one or more accepted contracts.
type: object
required:
  - legallyBinding
  - mfaCompleted
  - signatureId
  - signatureStatus
  - signatureType
  - signedContracts
properties:
  legallyBinding:
    description: Whether the signature is legally binding based on type and applicable jurisdiction. Determined by the provider.
    type: boolean
    examples:
      - true
    readOnly: true
  mfaCompleted:
    description: Whether MFA was completed during signing. Required for QES and AES.
    type: boolean
    examples:
      - true
  signatureId:
    description: Unique identifier of the signature, assigned by the provider.
    $ref: ./generic/Id.yaml
    readOnly: true
  signatureStatus:
    description: Validation state of the signature. Only a completed signature can be referenced when opening an account.
    type: string
    enum:
      - completed
      - pending
      - failed
    examples:
      - completed
    readOnly: true
  signatureType:
    description: eIDAS signature level. QES requires a QEAA-level identification of the customer.
    type: string
    enum:
      - QES
      - AES
      - SES
    examples:
      - QES
  signedContracts:
    description: Contracts covered by this signature. Every contract must have been accepted by the customer.
    type: array
    items:
      $ref: ./SignedContract.yaml
  createdAt:
    description: ISO 8601 timestamp of when the signature was recorded.
    type: string
    format: date-time
    examples:
      - '2024-03-15T11:10:00Z'
    readOnly: true
  signatureData:
    description: Technical data of the signature.
    type: object
    properties:
      certificate:
        description: X.509 digital certificate (PEM or Base64-encoded DER). For QES, must be from a qualified TSP.
        type: string
        examples:
          - MIIDdzCCAl+gAwIBAgIEAgAAuTANBgkqhkiG9w0BAQUFADBaMQswCQYDVQQGEwJJRTESMBAGA1UEChMJQmFsdGltb3Jl
      deviceInfo:
        description: Device type, OS, browser, and app version used for signing (audit and fraud detection).
        type: string
        examples:
          - iPhone 15; iOS 17.4; Banking App 5.2.1
      timestamp:
        description: Timestamp from a trusted timestamping authority (TSA) providing non-repudiation.
        type: string
        format: date-time
        examples:
          - '2024-03-15T11:10:00Z'
