title: Initialization response
description: Newly created onboarding process including the request data.
allOf:
  - $ref: ./InitializationRequest.yaml
  - type: object
    required:
      - processId
      - timestamp
    properties:
      processId:
        $ref: ./ProcessId.yaml
      timestamp:
        description: ISO 8601 timestamp when the onboarding session was created.
        type: string
        format: date-time
        examples:
          - '2024-03-15T09:30:00Z'
