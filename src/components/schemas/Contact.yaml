title: Contact
description: Contact details and preferred communication channel of the customer.
type: object
properties:
  emailAddress:
    description: Email address for e-banking login and digital correspondence.
    type: string
    format: email
    examples:
      - anna.muster@example.ch
  mobileNumber:
    description: Mobile number in E.164 format. Primary OTP and push notification channel.
    type: string
    examples:
      - '+41791234567'
  phoneNumber:
    description: Landline in E.164 format (e.g. +41441234567).
    type: string
    examples:
      - '+41441234567'
  preferredChannel:
    description: Customer's preferred communication channel.
    type: string
    enum:
      - email
      - sms
      - phone
      - app
    examples:
      - app
  verificationStatus:
    description: Verification state of the contact details.
    type: object
    properties:
      emailVerified:
        description: Whether the email has been verified via confirmation link or code.
        type: boolean
        examples:
          - true
      lastVerification:
        description: ISO 8601 timestamp of the most recent successful verification.
        type: string
        format: date-time
        examples:
          - '2024-03-15T09:41:27Z'
      phoneVerified:
        description: Whether the phone number has been verified via OTP or callback.
        type: boolean
        examples:
          - true
