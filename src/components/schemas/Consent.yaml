title: Consent
description: Consent of the customer for the collection and processing of personal data.
type: object
required:
  - consentId
  - dataCategories
  - expiresAt
  - grantedAt
  - grantedScopes
  - purposes
  - status
properties:
  consentId:
    description: Unique identifier for this consent grant.
    type: string
    format: uuid
    examples:
      - 6b1e2c4a-9d3f-4a7e-8b52-1c0f7e9a3d64
  dataCategories:
    description: Personal data categories the customer has authorized for collection.
    type: array
    items:
      type: string
      enum:
        - initialization
        - productSelection
        - selfDeclaration
        - basicData
        - financialProfile
        - identification
        - backgroundChecks
        - contracts
        - signature
      examples:
        - basicData
        - identification
  expiresAt:
    description: ISO 8601 timestamp after which the consent is no longer valid.
    type: string
    format: date-time
    examples:
      - '2025-03-15T09:30:00Z'
  grantedAt:
    description: ISO 8601 timestamp of when consent was granted.
    type: string
    format: date-time
    examples:
      - '2024-03-15T09:30:00Z'
  grantedScopes:
    description: OAuth 2.1 scopes granted to the consuming application (e.g. read:account, write:profile).
    type: array
    items:
      type: string
      examples:
        - read:account
        - write:profile
  purposes:
    description: |
      Specific purposes for data use, each with a legal basis under GDPR/DSG.
      Examples: account_opening, kyc_verification, credit_assessment, marketing, regulatory_reporting.
    type: array
    items:
      type: string
      examples:
        - account_opening
        - kyc_verification
  status:
    description: Lifecycle state of the consent.
    type: string
    enum:
      - active
      - revoked
      - expired
    examples:
      - active
