title: Signed contract
description: Single contract covered by an electronic signature.
type: object
required:
  - contractId
  - version
properties:
  contractId:
    description: Contract covered by the signature.
    $ref: ./generic/Id.yaml
  version:
    description: Version of the signed contract. Must match the accepted version.
    type: string
    examples:
      - '2.1'
  contractType:
    description: Type of the signed contract.
    type: string
    examples:
      - termsAndConditions
    readOnly: true
  signatureTimestamp:
    description: ISO 8601 timestamp of the signature. Equal to or later than the acceptanceTimestamp of the contract.
    type: string
    format: date-time
    examples:
      - '2024-03-15T11:10:00Z'
    readOnly: true
