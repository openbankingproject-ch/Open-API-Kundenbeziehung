title: Signed contract
description: Single contract covered by the digital signature.
type: object
required:
  - contractType
  - signatureId
  - signatureTimestamp
  - version
properties:
  contractType:
    description: Type of signed contract matching contractAcceptance step.
    type: string
    examples:
      - termsAndConditions
  signatureId:
    description: Unique signature identifier for certificate retrieval and integrity verification.
    type: string
    examples:
      - SIG-2024-000987
  signatureTimestamp:
    description: Must be equal to or later than the corresponding acceptanceTimestamp.
    type: string
    format: date-time
    examples:
      - '2024-03-15T11:10:00Z'
  version:
    description: Version of the signed contract, must match the accepted version.
    type: string
    examples:
      - '2.1'
