title: Audit entry
description: Single entry of the audit trail documenting an action performed during the onboarding process.
type: object
required:
  - action
  - originator
  - result
  - step
  - timestamp
properties:
  action:
    description: Machine-readable action identifier (e.g. consent_granted, contract_signed).
    type: string
    examples:
      - consent_granted
  originator:
    description: Entity that performed the action.
    type: string
    enum:
      - user
      - system
      - partner
    examples:
      - user
  result:
    description: Outcome of the action.
    type: string
    enum:
      - success
      - failure
      - pending
    examples:
      - success
  step:
    description: Onboarding step in which this action occurred.
    type: string
    examples:
      - consent
  timestamp:
    description: ISO 8601 timestamp of when the action was performed.
    type: string
    format: date-time
    examples:
      - '2024-03-15T09:32:11Z'
  deviceFingerprint:
    description: Hash representing the device used. Used for fraud detection.
    type: string
    examples:
      - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  ipAddress:
    description: IP address from which the action was initiated.
    type: string
    examples:
      - 203.0.113.42
