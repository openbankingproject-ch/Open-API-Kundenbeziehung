title: Contract item
description: Single contract document and its acceptance by the customer.
type: object
required:
  - acceptanceTimestamp
  - accepted
  - contractId
  - contractType
  - version
properties:
  acceptanceTimestamp:
    description: ISO 8601 timestamp of when the customer accepted this contract.
    type: string
    format: date-time
    examples:
      - '2024-03-15T11:02:45Z'
  accepted:
    description: Must be true for all required contracts before proceeding to signature.
    type: boolean
    examples:
      - true
  contractId:
    description: Unique identifier for this contract document instance.
    type: string
    examples:
      - CTR-2024-000123
  contractType:
    description: Type of the contract document.
    type: string
    enum:
      - termsAndConditions
      - dataSharingAgreement
      - baseContract
      - productAgreement
    examples:
      - termsAndConditions
  version:
    description: Version number of the contract (e.g. 2.1, 3.0).
    type: string
    examples:
      - '2.1'
  productId:
    description: Product catalog ID this contract applies to (relevant for productAgreement only).
    type: string
    examples:
      - PRV-ACC-STD
