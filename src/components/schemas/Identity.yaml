type: object
properties:
  personalData:
    type: object
    required:
      - givenName
      - lastName
      - dateOfBirth
    properties:
      title:
        type: string
        maxLength: 35
        description: Official title of the person (e.g. PhD, Dr.).
      givenName:
        type: string
        maxLength: 35
        description: Given name(s) of the person as shown on the identity document.
      middleName:
        type: string
        maxLength: 35
        description: Middle name(s) of the person as shown on the identity document.
      lastName:
        type: string
        maxLength: 35
        description: Legal surname as shown on identity document.
      gender:
        type: string
        enum: [male, female, divers]
        description: Gender of the person.
      dateOfBirth:
        type: string
        format: date
        description: Date of birth in YYYY-MM-DD format.
      countryOfBirth:
        type: string
        pattern: '^[A-Z]{2}$'
        description: Country where the person was born, as ISO 3166-1 alpha-2 code.
      placeOfBirth:
        type: string
        description: City or municipality of birth.
      placeOfOrigin:
        type: string
        description: Swiss Heimatort/Buergerort. Required for Swiss nationals only.
      nationalityList:
        type: array
        items:
          type: string
          pattern: '^[A-Z]{2}$'
        description: Nationalities as ISO 3166-1 alpha-2 codes. The first entry represents the main nationality.
      civilStatus:
        type: string
        enum: [single, married, divorced, legallyDivorced, separated, stableUnion, widow]
        description: Civil status of the person.
      externalIdentityId:
        type: object
        description: External consumer identity provider reference.
        properties:
          provider:
            type: string
            description: External identity provider (e.g. Google, Apple, Samsung).
          id:
            type: string
            description: Unique user identifier from the external provider.
