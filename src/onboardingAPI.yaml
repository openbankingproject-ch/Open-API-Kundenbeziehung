components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth authorization code flow. Further security requirements are defined by the provider.
      flows:
        authorizationCode:
          authorizationUrl: https://onboarding.common-api.ch/oauth/authorize
          tokenUrl: https://onboarding.common-api.ch/oauth/token
          scopes:
            accounts:read: Read the accounts of a customer.
            accounts:write: Open accounts for a customer.
            audit:read: Read the audit trail of a customer.
            consents:read: Read consents.
            consents:write: Create and revoke consents.
            contracts:read: Read contracts and signatures.
            contracts:write: Create, accept and sign contracts.
            customers:read: Read identity, address and contact data of a customer.
            customers:write: Create and change customers.
            kyc:read: Read the KYC data of a customer.
            kyc:write: Submit KYC data and request background checks.
