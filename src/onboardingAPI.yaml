openapi: 3.1.0
info:
  title: Customer Relationship API
  version: 2.0.0
  description: |
    API for establishing a customer relationship (Kundenbeziehung) with a financial institution, from the consent of the customer through to
    an opened account.

    The API is resource-oriented: consents, customers, KYC data, contracts, signatures and accounts are independent resources. The API does
    not prescribe an order of operations. The reference process, i.e. the order in which a client collects data and calls the operations of
    this API, is implemented by the clients and documented separately.

    Regardless of the order chosen by a client, the provider enforces the regulatory invariants. A request that would violate an invariant
    is rejected with 422 Unprocessable Content, and the problem type names the violated invariant:
    - CONSENT_MISSING: personal data is only stored under an active consent that covers its data category.
    - PRECONDITION_NOT_MET: a resource the operation depends on is missing or not in the required state, e.g. a signed contract that was not
    accepted, or an account for a customer whose background check is not approved.

    The invariants enforced by an operation are listed in its description.
  contact:
    email: info@common-api.ch
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://onboarding.common-api.ch/v2
externalDocs:
  description: Find out more about the Common API specifications.
  url: https://www.common-api.ch
tags:
  - name: accounts
    description: Opening of accounts for a customer and retrieval of the resulting core banking references.
  - name: audit-events
    description: Retrieval of the audit trail recorded by the provider for all changes of the resources of a customer.
  - name: consents
    description: Consent of the customer for the collection and processing of personal data, the legal basis for all other resources.
  - name: contracts
    description: Contract documents, their acceptance by the customer and their electronic signature.
  - name: customers
    description: Identity, address and contact data of the customer.
  - name: kyc
    description: Know-your-customer data, i.e. self declaration, financial profile, identity verification and AML / compliance screening.
security:
  - OAuth2: []
paths:
  /consents:
    post:
      tags:
        - consents
      summary: Create a consent
      description: |
        Records the consent of the customer for the collection and processing of personal data. A consent is the legal basis for every resource that
        stores personal data, so it is created before the customer and referenced by it.
      operationId: createConsent
      security:
        - OAuth2:
            - consents:write
      parameters:
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/idempotency_key.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/Consent.yaml
      responses:
        '201':
          description: Consent created.
          headers:
            Location:
              $ref: ./components/headers/Location.yaml
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Consent.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /consents/{consentId}:
    get:
      tags:
        - consents
      summary: Get a consent
      description: Returns a specific consent including its current lifecycle state.
      operationId: getConsent
      security:
        - OAuth2:
            - consents:read
      parameters:
        - $ref: ./components/parameters/path/consent_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The specified consent.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Consent.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    delete:
      tags:
        - consents
      summary: Revoke a consent
      description: |
        Revokes the consent. The provider retains the consent for audit purposes, so a subsequent request returns it with status revoked. No
        personal data can be stored under a revoked consent.
      operationId: revokeConsent
      security:
        - OAuth2:
            - consents:write
      parameters:
        - $ref: ./components/parameters/path/consent_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '204':
          description: Consent revoked.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '409':
          $ref: ./components/responses/standard409.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers:
    post:
      tags:
        - customers
      summary: Create a customer
      description: |
        Creates a customer with identity, address and contact data. Invariants: CONSENT_MISSING if the consent of the customer is not active or does
        not cover the data category identity (and address or contact, if provided).
      operationId: createCustomer
      security:
        - OAuth2:
            - customers:write
      parameters:
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/idempotency_key.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/Customer.yaml
      responses:
        '201':
          description: Customer created.
          headers:
            Location:
              $ref: ./components/headers/Location.yaml
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Customer.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}:
    get:
      tags:
        - customers
      summary: Get a customer
      description: Returns the identity, address and contact data of a specific customer.
      operationId: getCustomer
      security:
        - OAuth2:
            - customers:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The specified customer.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Customer.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    patch:
      tags:
        - customers
      summary: Update a customer
      description: |
        Updates the data of a customer with JSON merge patch semantics (RFC 7396): provided properties replace the stored ones, properties set to
        null are removed, omitted properties remain unchanged. Invariants: CONSENT_MISSING if the consent of the customer is not active or does not
        cover the data category of each changed property.
      operationId: updateCustomer
      security:
        - OAuth2:
            - customers:write
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/CustomerUpdate.yaml
      responses:
        '200':
          description: The updated customer.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Customer.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/self-declaration:
    get:
      tags:
        - kyc
      summary: Get the self declaration of a customer
      description: Returns the self declaration of a specific customer.
      operationId: getSelfDeclaration
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The self declaration of the customer.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/SelfDeclaration.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    put:
      tags:
        - kyc
      summary: Replace the self declaration of a customer
      description: |
        Stores the self declaration of the customer on beneficial ownership, tax residency and source of funds (FATCA / CRS / AML). Replaces the
        stored self declaration as a whole. Invariants: CONSENT_MISSING if the consent of the customer is not active or does not cover the data
        category selfDeclaration.
      operationId: updateSelfDeclaration
      security:
        - OAuth2:
            - kyc:write
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/SelfDeclaration.yaml
      responses:
        '200':
          description: The stored self declaration.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/SelfDeclaration.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/financial-profile:
    get:
      tags:
        - kyc
      summary: Get the financial profile of a customer
      description: Returns the financial profile of a specific customer.
      operationId: getFinancialProfile
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The financial profile of the customer.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/FinancialProfile.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    put:
      tags:
        - kyc
      summary: Replace the financial profile of a customer
      description: |
        Stores assets, income, employment, education and financial knowledge of the customer (MiFID II / KYC extended data). Replaces the stored
        financial profile as a whole. Invariants: CONSENT_MISSING if the consent of the customer is not active or does not cover the data category
        financialProfile.
      operationId: updateFinancialProfile
      security:
        - OAuth2:
            - kyc:write
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/FinancialProfile.yaml
      responses:
        '200':
          description: The stored financial profile.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/FinancialProfile.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/identifications:
    get:
      tags:
        - kyc
      summary: Get a list of all identifications of a customer
      description: Returns all identity verifications of a specific customer, most recent first.
      operationId: listIdentifications
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/query/cursor.yaml
        - $ref: ./components/parameters/query/limit.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: Paginated list of identifications.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
            X-Next-Cursor:
              $ref: ./components/headers/X-Next-Cursor.yaml
          content:
            application/json:
              schema:
                type: object
                required:
                  - identifications
                properties:
                  identifications:
                    type: array
                    items:
                      $ref: ./components/schemas/Identification.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    post:
      tags:
        - kyc
      summary: Create an identification
      description: |
        Records the result of an identity verification of the customer, including document, biometric and audit data. A customer can have several
        identifications; the most recent one determines the verification level of the customer. Invariants: CONSENT_MISSING if the consent of the
        customer does not cover the data category identification; PRECONDITION_NOT_MET if the identity document was expired at the time of
        verification.
      operationId: createIdentification
      security:
        - OAuth2:
            - kyc:write
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/idempotency_key.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components/schemas/Identification.yaml
      responses:
        '201':
          description: Identification created.
          headers:
            Location:
              $ref: ./components/headers/Location.yaml
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Identification.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/identifications/{identificationId}:
    get:
      tags:
        - kyc
      summary: Get an identification
      description: Returns a specific identity verification of a customer.
      operationId: getIdentification
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/path/identification_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The specified identification.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/Identification.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/background-checks:
    get:
      tags:
        - kyc
      summary: Get a list of all background checks of a customer
      description: Returns all AML and compliance background checks of a specific customer, most recent first.
      operationId: listBackgroundChecks
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/query/cursor.yaml
        - $ref: ./components/parameters/query/limit.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: Paginated list of background checks.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
            X-Next-Cursor:
              $ref: ./components/headers/X-Next-Cursor.yaml
          content:
            application/json:
              schema:
                type: object
                required:
                  - backgroundChecks
                properties:
                  backgroundChecks:
                    type: array
                    items:
                      $ref: ./components/schemas/BackgroundCheck.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
    post:
      tags:
        - kyc
      summary: Request a background check
      description: |
        Requests AML and compliance screening (sanctions, PEP, crime, credit and adverse media) of the customer based on the data currently stored.
        The screening runs asynchronously: the background check is returned with complianceStatus pending and can be polled at the returned location
        until complianceStatus changes. manual_review requires handling by the provider. Invariants: CONSENT_MISSING if the consent of the customer
        is not active or does not cover the data category backgroundCheck.
      operationId: createBackgroundCheck
      security:
        - OAuth2:
            - kyc:write
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/idempotency_key.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '202':
          description: Background check requested.
          headers:
            Location:
              $ref: ./components/headers/Location.yaml
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/BackgroundCheck.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '422':
          $ref: ./components/responses/standard422.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/background-checks/{backgroundCheckId}:
    get:
      tags:
        - kyc
      summary: Get a background check
      description: Returns a specific background check including the check results and the compliance decision.
      operationId: getBackgroundCheck
      security:
        - OAuth2:
            - kyc:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/path/background_check_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: The specified background check.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/BackgroundCheck.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
  /customers/{customerId}/contracts:
    get:
      tags:
        - contracts
      summary: Get a list of all contracts of a customer
      description: Returns all contracts of a specific customer and whether the customer accepted them.
      operationId: listContracts
      security:
        - OAuth2:
            - contracts:read
      parameters:
        - $ref: ./components/parameters/path/customer_id.yaml
        - $ref: ./components/parameters/query/cursor.yaml
        - $ref: ./components/parameters/query/limit.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/header/psu_ip.yaml
        - $ref: ./components/parameters/header/psu_user_agent.yaml
      responses:
        '200':
          description: Paginated list of contracts.
          headers:
