openapi: 3.1.0
info:
  title: OpenAPI Kundenbeziehung
  version: 2.0.0
  description: |
    Resource-oriented digital banking API for customer management, applications, and compliance.
paths:
  /consents:
    post:
      summary: Record customer consent
      operationId: createConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/standard400'

  /customers:
    post:
      summary: Create a new customer record (Base Data)
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseData'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/standard400'

  /customers/{customerId}/self-declaration:
    put:
      summary: Update FATCA / CRS / AML self-declaration
      operationId: updateSelfDeclaration
      parameters:
        - $ref: '#/components/parameters/customer_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfDeclaration'
      responses:
        '200':
          description: Self declaration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfDeclaration'
        '404':
          $ref: '#/components/responses/standard404'

  /customers/{customerId}/financial-profile:
    put:
      summary: Update financial profile (MiFID II / KYC)
      operationId: updateFinancialProfile
      parameters:
        - $ref: '#/components/parameters/customer_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialProfile'
      responses:
        '200':
          description: Financial profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialProfile'
        '404':
          $ref: '#/components/responses/standard404'

  /customers/{customerId}/identifications:
    post:
      summary: Record identity verification (KYC)
      operationId: createIdentification
      parameters:
        - $ref: '#/components/parameters/customer_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identification'
      responses:
        '201':
          description: Identification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identification'
        '404':
          $ref: '#/components/responses/standard404'

  /customers/{customerId}/background-checks:
    get:
      summary: Retrieve AML / compliance check results
      operationId: getBackgroundChecks
      parameters:
        - $ref: '#/components/parameters/customer_id'
      responses:
        '200':
          description: Background check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundChecks'
        '404':
          $ref: '#/components/responses/standard404'

  /applications:
    post:
      summary: Create a product application
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/standard400'

  /applications/{applicationId}/contract-acceptances:
    post:
      summary: Accept application contracts
      operationId: createContractAcceptance
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractAcceptance'
      responses:
        '201':
          description: Contract acceptance recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractAcceptance'
        '404':
          $ref: '#/components/responses/standard404'

  /applications/{applicationId}/signatures:
    post:
      summary: Apply digital signature to application contracts
      operationId: createSignature
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signature'
      responses:
        '201':
          description: Signature recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signature'
        '404':
          $ref: '#/components/responses/standard404'

components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          properties:
            customerId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time

    ApplicationRequest:
      type: object
      required:
        - customerId
        - productSelection
      properties:
        customerId:
          type: string
          format: uuid
        productSelection:
          $ref: '#/components/schemas/ProductSelection'

    ApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/ApplicationRequest'
        - type: object
          properties:
            applicationId:
              type: string
              format: uuid
            status:
              type: string
              enum: [ pending, approved, rejected, completed ]
            createdAt:
              type: string
              format: date-time

    ProductSelection:
      type: object
      required:
        - accountType
        - productPackage
      properties:
        accountType:
          type: string
          enum: [ private, savings, youth, business ]
        productPackage:
          type: string
          enum: [ standard, student, youth, premium, business ]
        additionalProducts:
          type: array
          items:
            type: string
        selectedProducts:
          type: object
          properties:
            monthlyFee:
              type: number
            currency:
              type: string
              pattern: ^[A-Z]{3}$

    Consent:
      type: object
      required:
        - dataCategories
        - purposes
        - status
      properties:
        consentId:
          type: string
          format: uuid
          readOnly: true
        customerId:
          type: string
          format: uuid
          description: Associated customer, if known at time of consent.
        dataCategories:
          type: array
          items:
            type: string
            enum: [ basicData, financialProfile, identification, backgroundChecks, contracts ]
        purposes:
          type: array
          items:
            type: string
        grantedScopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ active, revoked, expired ]
        grantedAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time

    SelfDeclaration:
      type: object
      required:
        - economicBeneficiary
        - taxDomicile
        - usTaxLiability
        - fatcaDeclaration
        - sourceOfFunds
        - nationalityList
        - taxComplianceDeclaration
      properties:
        economicBeneficiary:
          type: boolean
        taxDomicile:
          type: string
          pattern: ^[A-Z]{2}$
        usTaxLiability:
          type: boolean
        fatcaDeclaration:
          type: object
          properties:
            status:
              type: string
              enum: [ non_us_person, us_person, recalcitrant ]
            confirmed:
              type: boolean
        tin:
          type: string
        sourceOfFunds:
          type: string
          enum: [ employment, business, investment, inheritance, savings, gift, real_estate, other ]
        nationalityList:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        taxComplianceDeclaration:
          type: object
          properties:
            confirmed:
              type: boolean
            declarationDate:
              type: string
              format: date-time

    Identity:
      type: object
      properties:
        personalData:
          type: object
          required:
            - givenName
            - lastName
            - dateOfBirth
          properties:
            title:
              type: string
            givenName:
              type: string
            middleName:
              type: string
            lastName:
              type: string
            gender:
              type: string
              enum: [ male, female, divers ]
            dateOfBirth:
              type: string
              format: date
            countryOfBirth:
              type: string
              pattern: ^[A-Z]{2}$
            placeOfBirth:
              type: string
            placeOfOrigin:
              type: string
            nationalityList:
              type: array
              items:
                type: string
                pattern: ^[A-Z]{2}$
            civilStatus:
              type: string
              enum: [ single, married, divorced, legallyDivorced, separated, stableUnion, widow ]
            externalIdentityId:
              type: object
              properties:
                provider:
                  type: string
                id:
                  type: string

    AddressEntry:
      type: object
      required:
        - addressType
        - streetName
        - buildingNumber
        - postCode
        - townName
        - country
      properties:
        addressType:
          type: string
        streetName:
          type: string
        buildingNumber:
          type: string
        postCode:
          type: string
        townName:
          type: string
        country:
          type: string
          pattern: ^[A-Z]{2}$
        countrySubDivision:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date

    AddressData:
      type: object
      properties:
        residentialAddress:
          $ref: '#/components/schemas/AddressEntry'
        correspondenceAddress:
          $ref: '#/components/schemas/AddressEntry'

    Contact:
      type: object
      properties:
        phoneNumber:
          type: string
        mobileNumber:
          type: string
        emailAddress:
          type: string
          format: email
        preferredChannel:
          type: string
          enum: [ email, sms, phone, app ]
        verificationStatus:
          type: object
          properties:
            phoneVerified:
              type: boolean
            emailVerified:
              type: boolean
            lastVerification:
              type: string
              format: date-time

    BaseData:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        address:
          $ref: '#/components/schemas/AddressData'
        contact:
          $ref: '#/components/schemas/Contact'

    FinancialProfile:
      type: object
      properties:
        totalAssets:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            assetRange:
              type: string
            lastUpdated:
              type: string
              format: date-time
        income:
          type: object
          properties:
            annualGrossIncome:
              type: number
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            incomeRange:
              type: string
            incomeType:
              type: string
              enum: [ employment, business, investment, pension, other ]
            lastUpdated:
              type: string
              format: date-time
        employment:
          type: object
          properties:
            profession:
              type: string
            employer:
              type: string
            employmentType:
              type: string
              enum: [ permanent, temporary, self-employed, retired, student ]
            yearsWithEmployer:
              type: number
            industry:
              type: string
        education:
          type: object
          properties:
            highestDegree:
              type: string
            fieldOfStudy:
              type: string
            institution:
              type: string
        financialKnowledge:
          type: object
          properties:
            investmentExperience:
              type: string
              enum: [ none, basic, intermediate, advanced ]
            riskTolerance:
              type: string
              enum: [ low, moderate, high ]
            investmentHorizon:
              type: string
              enum: [ short-term, medium-term, long-term ]

    Identification:
      type: object
      required:
        - identificationMethod
        - referenceNumber
        - verificationDate
        - documentData
        - verificationLevel
      properties:
        identificationMethod:
          type: string
          enum: [ VideoIdent, EID, PostIdent, BankIdent, AutoIdent ]
        referenceNumber:
          type: string
        verificationDate:
          type: string
          format: date-time
        documentData:
          type: object
          required:
            - documentType
            - documentNumber
            - expiryDate
          properties:
            documentType:
              type: string
              enum: [ passport, id, residence_permit ]
            documentNumber:
              type: string
            issuingAuthority:
              type: string
            issueDate:
              type: string
              format: date
            issuePlace:
              type: string
            expiryDate:
              type: string
              format: date
            mrz:
              type: string
            nfcData:
              type: object
              properties:
                chipVerified:
                  type: boolean
                biometricDataHash:
                  type: string
                securityFeaturesVerified:
                  type: number
                chipAuthenticationStatus:
                  type: string
                  enum: [ verified, failed ]
        verificationLevel:
          type: string
          enum: [ QEAA, EAA, self-declared ]
        biometricVerification:
          type: object
          properties:
            livenessScore:
              type: number
            faceMatchScore:
              type: number
            documentAuthenticityScore:
              type: number
            securityFeaturesChecked:
              type: number
            securityFeaturesVerified:
              type: number
        auditTrail:
          type: object
          properties:
            videoReference:
              type: string
            documentScanReference:
              type: string
            timestamp:
              type: string
              format: date-time
            originator:
              type: string

    BackgroundChecks:
      type: object
      properties:
        checksCompleted:
          type: object
          properties:
            sanctionCheck:
              type: string
              enum: [ passed, failed, pending ]
            pepCheck:
              type: string
              enum: [ passed, failed, pending ]
            crimeCheck:
              type: string
              enum: [ passed, failed, pending ]
            creditCheck:
              type: string
              enum: [ passed, failed, pending ]
            adverseMediaCheck:
              type: string
              enum: [ passed, failed, pending ]
        pepDetails:
          type: object
          properties:
            pepStatus:
              type: string
              enum: [ 'no', 'yes' ]
            pepCategory:
              type: string
            lastChecked:
              type: string
              format: date-time
        amlRiskClass:
          type: string
          enum: [ low, medium, high ]
        riskAssessment:
          type: object
          properties:
            overallRisk:
              type: string
              enum: [ low, medium, high ]
            riskScore:
              type: number
            riskFactors:
              type: array
              items:
                type: string
            lastAssessment:
              type: string
              format: date-time
        complianceStatus:
          type: string
          enum: [ approved, rejected, pending, manual_review ]

    ContractItem:
      type: object
      required:
        - contractType
        - contractId
        - version
        - accepted
        - acceptanceTimestamp
      properties:
        contractType:
          type: string
          enum: [ termsAndConditions, dataSharingAgreement, baseContract, productAgreement ]
        contractId:
          type: string
        version:
          type: string
        accepted:
          type: boolean
        acceptanceTimestamp:
          type: string
          format: date-time
        productId:
          type: string

    ContractAcceptance:
      type: object
      required:
        - contracts
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractItem'

    SignedContract:
      type: object
      required:
        - contractType
        - version
        - signatureTimestamp
        - signatureId
      properties:
        contractType:
          type: string
        version:
          type: string
        signatureTimestamp:
          type: string
          format: date-time
        signatureId:
          type: string

    Signature:
      type: object
      required:
        - signatureType
        - signatureStatus
        - legallyBinding
        - mfaCompleted
      properties:
        signatureType:
          type: string
          enum: [ QES, AES, SES ]
        signatureStatus:
          type: string
          enum: [ completed, pending, failed ]
        signedContracts:
          type: array
          items:
            $ref: '#/components/schemas/SignedContract'
        signatureData:
          type: object
          properties:
            certificate:
              type: string
            timestamp:
              type: string
              format: date-time
            deviceInfo:
              type: string
        legallyBinding:
          type: boolean
        mfaCompleted:
          type: boolean

  responses:
    standard400:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    standard404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    customer_id:
      name: customerId
      in: path
      required: true
      description: Unique identifier for the customer
      schema:
        type: string
        format: uuid
    application_id:
      name: applicationId
      in: path
      required: true
      description: Unique identifier for the product application
      schema:
        type: string
        format: uuid
