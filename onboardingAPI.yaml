        legallyBinding. Invariants: CONSENT_MISSING if the consent of the customer does not cover the data category signature; PRECONDITION_NOT_MET
        if a signed contract does not belong to the customer, is not accepted or its version does not match, if a QES is submitted without a
        QEAA-level identification of the customer, or if a QES or AES is submitted without completed MFA.
      operationId: createSignature
