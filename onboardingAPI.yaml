components:
  schemas:
    Id:
      title: Shared identifier
      description: Technical identifier of a resource, assigned by the provider.
      type: string
      maxLength: 256
      pattern: ^[A-Za-z0-9](([A-Za-z0-9._]|-){0,254}[A-Za-z0-9]){0,1}$
      examples:
        - c-7f3a9b2e
    Consent:
      title: Consent
      description: |
        Consent of the customer for the collection and processing of personal data. Every operation that stores personal data checks that an active
        consent covers the affected data category.
      type: object
      required:
        - consentId
        - dataCategories
        - expiresAt
        - grantedAt
        - grantedScopes
        - jurisdiction
        - purposes
        - status
      properties:
        consentId:
          description: Unique identifier for this consent grant.
          $ref: '#/components/schemas/Id'
          readOnly: true
        dataCategories:
          description: Personal data categories the customer has authorized for collection and processing.
          type: array
          items:
            type: string
            enum:
              - identity
              - address
              - contact
              - selfDeclaration
              - financialProfile
              - identification
              - backgroundCheck
              - contract
              - signature
            examples:
              - identity
              - identification
        expiresAt:
          description: ISO 8601 timestamp after which the consent is no longer valid.
          type: string
          format: date-time
          examples:
            - '2025-03-15T09:30:00Z'
        grantedAt:
          description: ISO 8601 timestamp of when consent was granted.
          type: string
          format: date-time
          examples:
            - '2024-03-15T09:30:00Z'
          readOnly: true
        grantedScopes:
          description: OAuth scopes granted to the consuming application (e.g. customers:read, kyc:write).
          type: array
          items:
            type: string
            examples:
              - customers:read
              - kyc:write
        jurisdiction:
          description: ISO 3166-1 alpha-2 country code of the jurisdiction whose data protection law applies (e.g. CH for DSG, DE for GDPR).
          type: string
          pattern: ^[A-Z]{2}$
          examples:
            - CH
        purposes:
          description: |
            Specific purposes for data use, each with a legal basis under GDPR/DSG.
            Examples: account_opening, kyc_verification, credit_assessment, marketing, regulatory_reporting.
          type: array
          items:
            type: string
            examples:
              - account_opening
              - kyc_verification
        status:
          description: Lifecycle state of the consent. A revoked or expired consent no longer permits storing personal data.
          type: string
          enum:
            - active
            - revoked
            - expired
          examples:
            - active
          readOnly: true
    CommonErrorResponse:
      title: Common Error Response
      description: General error response structure according to RFC 7807 (Problem Details for HTTP APIs) used in different response codes.
      type: object
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
          examples:
            - The field country must be an ISO 3166-1 alpha-2 country code.
        instance:
          description: A (relative) URI reference that identifies the specific occurrence of the problem.
          type: string
          examples:
            - /customers/c-7f3a9b2e
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          type: integer
          examples:
            - 400
        title:
          description: A short, human-readable summary of the problem type.
          type: string
          examples:
            - Bad Request
        type:
          description: |
            A URI reference that identifies the problem type. When "about:blank" is used, the title SHOULD be the same as the recommended HTTP
            status phrase for that code (e.g., "Not Found" for 404, and so on).
          type: string
          examples:
            - about:blank
    Identity:
      title: Identity
      description: Identity data of the customer.
      type: object
      properties:
        personalData:
          description: Personal data of the customer as shown on the identity document.
          type: object
          required:
            - dateOfBirth
            - givenName
            - lastName
          properties:
            dateOfBirth:
              description: Date of birth in YYYY-MM-DD format.
              type: string
              format: date
              examples:
                - '1990-01-01'
            givenName:
              description: Given name(s) of the person as shown on the identity document.
              type: string
              maxLength: 35
              examples:
                - Anna
            lastName:
              description: Legal surname as shown on identity document.
              type: string
              maxLength: 35
              examples:
                - Muster
            civilStatus:
              description: Civil status of the person.
              type: string
              enum:
                - single
                - married
                - divorced
                - legallyDivorced
                - separated
                - stableUnion
                - widow
              examples:
                - married
            countryOfBirth:
              description: Country where the person was born, as ISO 3166-1 alpha-2 code.
              type: string
              pattern: ^[A-Z]{2}$
              examples:
                - CH
            externalIdentityId:
              description: External consumer identity provider reference.
              type: object
              properties:
                id:
                  description: Unique user identifier from the external provider.
                  type: string
                  examples:
                    - '108234567890123456789'
                provider:
                  description: External identity provider (e.g. Google, Apple, Samsung).
                  type: string
                  examples:
                    - Apple
            gender:
              description: Gender of the person.
              type: string
              enum:
                - male
                - female
                - divers
              examples:
                - female
            middleName:
              description: Middle name(s) of the person as shown on the identity document.
              type: string
              maxLength: 35
              examples:
                - Maria
            nationalityList:
              description: Nationalities as ISO 3166-1 alpha-2 codes. The first entry represents the main nationality.
              type: array
              items:
                type: string
                pattern: ^[A-Z]{2}$
                examples:
                  - CH
                  - DE
            placeOfBirth:
              description: City or municipality of birth.
              type: string
              examples:
                - Winterthur
            placeOfOrigin:
              description: Swiss Heimatort/Buergerort. Required for Swiss nationals only.
              type: string
              examples:
                - Glarus
            title:
              description: Official title of the person (e.g. PhD, Dr.).
              type: string
              maxLength: 35
              examples:
                - Dr.
    AddressEntry:
      title: Address entry
      description: Structured postal address based on the ISO 20022 postal address elements.
      type: object
      required:
        - addressType
        - buildingNumber
        - country
        - postCode
        - streetName
        - townName
      properties:
        addressType:
          description: Address type identifier (e.g. residential).
          type: string
          examples:
            - residential
        buildingNumber:
          description: Number that identifies the position of the building on a street (text to accommodate formats like 12a, 3/4).
          type: string
          maxLength: 35
          examples:
            - 12a
        country:
          description: ISO 3166-1 alpha-2 country code.
          type: string
          pattern: ^[A-Z]{2}$
          examples:
            - CH
        postCode:
          description: Postal code added to a postal address to assist the sorting of mail.
          type: string
          maxLength: 35
          examples:
            - '8001'
        streetName:
          description: Name of the street or thoroughfare.
          type: string
          maxLength: 35
          examples:
            - Bahnhofstrasse
        townName:
          description: Name of the town or city.
          type: string
          maxLength: 35
          examples:
            - Zürich
        countrySubDivision:
          description: Subdivision of a country such as canton (CH), federal state (DE), region, or county.
          type: string
          maxLength: 35
          examples:
            - ZH
        validFrom:
          description: Date from which the customer has resided at this address (YYYY-MM-DD).
          type: string
          format: date
          examples:
            - '2019-04-01'
        validTo:
          description: Date until which the customer resided here. Empty means current address.
          type: string
          format: date
          examples:
            - '2024-03-31'
    AddressData:
      title: Address data
      description: Residential and correspondence address of the customer.
      type: object
      properties:
        correspondenceAddress:
          description: Address for physical mail. Defaults to residentialAddress if not provided.
          allOf:
            - $ref: '#/components/schemas/AddressEntry'
        residentialAddress:
          description: Primary domicile address required for KYC and tax residency determination.
          allOf:
            - $ref: '#/components/schemas/AddressEntry'
    Contact:
      title: Contact
      description: Contact details and preferred communication channel of the customer.
      type: object
      properties:
        emailAddress:
          description: Email address for e-banking login and digital correspondence.
          type: string
          format: email
          examples:
            - anna.muster@example.ch
        mobileNumber:
          description: Mobile number in E.164 format. Primary OTP and push notification channel.
          type: string
          examples:
            - '+41791234567'
        phoneNumber:
          description: Landline in E.164 format (e.g. +41441234567).
          type: string
          examples:
            - '+41441234567'
        preferredChannel:
          description: Customer's preferred communication channel.
          type: string
          enum:
            - email
            - sms
            - phone
            - app
          examples:
            - app
        verificationStatus:
          description: Verification state of the contact details.
          type: object
          properties:
            emailVerified:
              description: Whether the email has been verified via confirmation link or code.
              type: boolean
              examples:
                - true
            lastVerification:
              description: ISO 8601 timestamp of the most recent successful verification.
              type: string
              format: date-time
              examples:
                - '2024-03-15T09:41:27Z'
            phoneVerified:
              description: Whether the phone number has been verified via OTP or callback.
              type: boolean
              examples:
                - true
    Customer:
      title: Customer
      description: Natural person for whom the customer relationship is established, with identity, address and contact data.
      type: object
      required:
        - consentId
        - customerId
        - identity
      properties:
        consentId:
          description: Consent under which the personal data of this customer is collected and processed.
          $ref: '#/components/schemas/Id'
        customerId:
          description: Unique identifier of the customer, assigned by the provider.
          $ref: '#/components/schemas/Id'
          readOnly: true
        identity:
          $ref: '#/components/schemas/Identity'
        address:
          $ref: '#/components/schemas/AddressData'
        contact:
          $ref: '#/components/schemas/Contact'
        coreBankingId:
          description: Unique customer ID in the core banking system (T24, Avaloq, Finnova, etc.). Assigned once the first account is opened.
          type: string
          examples:
            - '100045872'
          readOnly: true
        createdAt:
          description: ISO 8601 timestamp of when the customer was created.
          type: string
          format: date-time
          examples:
            - '2024-03-15T09:45:00Z'
          readOnly: true
        updatedAt:
          description: ISO 8601 timestamp of the most recent change of the customer.
          type: string
          format: date-time
          examples:
            - '2024-03-15T09:45:00Z'
          readOnly: true
    CustomerUpdate:
      title: Customer update
      description: Properties of a customer to change. Omitted properties remain unchanged.
      type: object
      properties:
        address:
          $ref: '#/components/schemas/AddressData'
        consentId:
          description: Consent under which the personal data of this customer is collected and processed.
          $ref: '#/components/schemas/Id'
        contact:
          $ref: '#/components/schemas/Contact'
        identity:
          $ref: '#/components/schemas/Identity'
    SelfDeclaration:
      title: Self declaration
      description: Self declaration of the customer on beneficial ownership, tax residency and source of funds (FATCA / CRS / AML).
      type: object
      required:
        - economicBeneficiary
        - fatcaDeclaration
        - nationalityList
        - sourceOfFunds
        - taxComplianceDeclaration
        - taxDomicile
        - usTaxLiability
      properties:
        economicBeneficiary:
          description: Whether the customer is the economic beneficiary (acting on their own behalf).
          type: boolean
          examples:
            - true
        fatcaDeclaration:
          description: FATCA declaration of the customer.
          type: object
          required:
            - confirmed
            - status
          properties:
            confirmed:
              description: Whether the customer has explicitly confirmed their FATCA status.
              type: boolean
              examples:
                - true
            status:
              description: Customer's FATCA classification.
              type: string
              enum:
                - non_us_person
                - us_person
                - recalcitrant
              examples:
                - non_us_person
        nationalityList:
          description: All nationalities held by the customer as ISO 3166-1 alpha-2 codes. The first entry represents the main nationality.
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            examples:
              - CH
              - DE
        sourceOfFunds:
          description: Primary origin of funds for AML risk assessment per FINMA guidelines.
          type: string
          enum:
            - employment
            - business
            - investment
            - inheritance
            - savings
            - gift
            - real_estate
            - other
          examples:
            - employment
        taxComplianceDeclaration:
          description: Declaration of the customer on compliance with applicable tax laws.
          type: object
          required:
            - confirmed
            - declarationDate
          properties:
            confirmed:
              description: Whether the customer has confirmed compliance with all applicable tax laws.
              type: boolean
              examples:
                - true
            declarationDate:
              description: ISO 8601 timestamp of when the declaration was confirmed.
              type: string
              format: date-time
              examples:
                - '2024-03-15T09:38:00Z'
        taxDomicile:
          description: ISO 3166-1 alpha-2 country code of primary tax residency.
          type: string
          pattern: ^[A-Z]{2}$
          examples:
            - CH
        usTaxLiability:
          description: Whether the customer has a US tax obligation triggering FATCA reporting.
          type: boolean
          examples:
            - false
        tin:
          description: Tax Identification Number for the declared tax domicile (e.g. AHV/AVS for CH).
          type: string
          examples:
            - 756.1234.5678.97
    Amount:
      title: Shared amount
      description: Amount of money, transmitted as string to avoid rounding errors of floating point numbers.
      type: string
      pattern: ^[0-9]{1,12}([.][0-9]{1,5})?$
      examples:
        - '5.00'
    FinancialProfile:
      title: Financial profile
      description: Financial situation, employment, education and financial knowledge of the customer (MiFID II / KYC extended data).
      type: object
      properties:
        education:
          description: Education background of the customer.
          type: object
          properties:
            fieldOfStudy:
              description: Field of study of the highest completed education.
              type: string
              examples:
                - Economics
            highestDegree:
              description: Highest completed education level (e.g. Bachelor, Master, PhD, Apprenticeship).
              type: string
              examples:
                - Master
            institution:
              description: Institution at which the highest degree was obtained.
              type: string
              examples:
                - University of Zurich
        employment:
          description: Current employment situation of the customer.
          type: object
          properties:
            employer:
              description: Name of current employer.
              type: string
              examples:
                - Muster AG
            employmentType:
              description: Type of the current employment relationship.
              type: string
              enum:
                - permanent
                - temporary
                - self-employed
                - retired
                - student
              examples:
                - permanent
            industry:
              description: Industry sector (e.g. finance, technology, healthcare, public_sector).
              type: string
              examples:
                - finance
            profession:
              description: Current job title or professional role.
              type: string
              examples:
                - Software Engineer
            yearsWithEmployer:
              description: Years with current employer. Positive factor in credit assessments.
              type: number
              examples:
                - 4
        financialKnowledge:
          description: Self-assessed financial knowledge for the MiFID II suitability assessment.
          type: object
          properties:
            investmentExperience:
              description: Self-assessed investment experience level. Required under MiFID II.
              type: string
              enum:
                - none
                - basic
                - intermediate
                - advanced
              examples:
                - intermediate
            investmentHorizon:
              description: Intended investment timeframe for MiFID II suitability assessment.
              type: string
              enum:
                - short-term
                - medium-term
                - long-term
              examples:
                - long-term
            riskTolerance:
              description: Self-assessed investment risk willingness. Required under MiFID II.
              type: string
              enum:
                - low
                - moderate
                - high
              examples:
                - moderate
        income:
          description: Income of the customer.
          type: object
          properties:
            annualGrossIncome:
              description: Annual gross income before taxes. Either annualGrossIncome or incomeRange must be provided.
              $ref: '#/components/schemas/Amount'
            currency:
              description: ISO 4217 currency code. Required when annualGrossIncome is provided.
              type: string
              pattern: ^[A-Z]{3}$
              examples:
                - CHF
            incomeRange:
              description: Bracketed range for annual gross income when exact amount is not provided.
              type: string
              examples:
                - 100000-150000
            incomeType:
              description: Primary source of the income.
              type: string
              enum:
                - employment
                - business
                - investment
                - pension
                - other
              examples:
                - employment
            lastUpdated:
              description: ISO 8601 timestamp of the most recent update of the income data.
              type: string
              format: date-time
              examples:
                - '2024-03-15T10:12:00Z'
        totalAssets:
          description: Total net worth of the customer.
          type: object
          properties:
            amount:
              description: Total net worth. Either amount or assetRange must be provided.
              $ref: '#/components/schemas/Amount'
            assetRange:
              description: Bracketed range (e.g. 200000-500000) when exact amount is not provided.
              type: string
              examples:
                - 200000-500000
            currency:
              description: ISO 4217 currency code. Required when amount is provided.
              type: string
              pattern: ^[A-Z]{3}$
              examples:
                - CHF
            lastUpdated:
              description: ISO 8601 timestamp of the most recent update of the asset data.
              type: string
              format: date-time
              examples:
                - '2024-03-15T10:12:00Z'
    Identification:
      title: Identification
      description: Result of the identity verification of the customer (KYC).
      type: object
      required:
        - documentData
        - identificationId
        - identificationMethod
        - referenceNumber
        - verificationDate
        - verificationLevel
      properties:
        documentData:
          description: Data of the identity document used for the verification.
          type: object
          required:
            - documentNumber
            - documentType
            - expiryDate
          properties:
            documentNumber:
              description: Number of the identity document.
              type: string
              examples:
                - X1234567
            documentType:
              description: Type of the identity document.
              type: string
              enum:
                - passport
                - id
                - residence_permit
              examples:
                - passport
            expiryDate:
              description: Document must not be expired at time of verification.
              type: string
              format: date
              examples:
                - '2031-06-30'
            issueDate:
              description: Date on which the identity document was issued.
              type: string
              format: date
              examples:
                - '2021-07-01'
            issuePlace:
              description: Place where the identity document was issued.
              type: string
              examples:
                - Zürich
            issuingAuthority:
              description: Authority that issued the identity document.
              type: string
              examples:
                - Migrationsamt des Kantons Zürich
            mrz:
              description: Machine Readable Zone data in ICAO 9303 format.
              type: string
              examples:
                - P<CHEMUSTER<<ANNA<<<<<<<<<<<<<<<<<<<<<<<<<<<X1234567<2CHE9001019F3106305<<<<<<<<<<<<<<04
            nfcData:
              description: Data read from the NFC chip of the identity document.
              type: object
              properties:
                biometricDataHash:
                  description: Cryptographic hash of biometric data stored on the NFC chip.
                  type: string
                  examples:
                    - 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                chipAuthenticationStatus:
                  description: Result of the chip authentication.
                  type: string
                  enum:
                    - verified
                    - failed
                  examples:
                    - verified
                chipVerified:
                  description: Whether the NFC chip was successfully read and its signature validated.
                  type: boolean
                  examples:
                    - true
                securityFeaturesVerified:
                  description: Count of NFC chip security features successfully verified.
                  type: number
                  examples:
                    - 3
        identificationId:
          description: Unique identifier of the identification, assigned by the provider.
          $ref: '#/components/schemas/Id'
          readOnly: true
        identificationMethod:
          description: Method used to verify the customer's identity.
          type: string
          enum:
            - VideoIdent
            - EID
            - PostIdent
            - BankIdent
            - AutoIdent
          examples:
            - VideoIdent
        referenceNumber:
          description: Unique reference for this identification session.
          type: string
          examples:
            - IDV-2024-0042871
        verificationDate:
          description: ISO 8601 timestamp of when verification was completed.
          type: string
          format: date-time
          examples:
            - '2024-03-15T10:48:03Z'
        verificationLevel:
          description: Achieved eIDAS trust level. Determines available products and signature types (QES requires QEAA).
          type: string
          enum:
            - QEAA
            - EAA
            - self-declared
          examples:
            - QEAA
        auditTrail:
          description: References to the evidence recorded during the identification.
          type: object
          properties:
            documentScanReference:
              description: URL/reference to scanned identity document images.
              type: string
              examples:
                - dms://identification/IDV-2024-0042871/document-scan
            originator:
              description: Agent ID (VideoIdent) or system identifier (automated methods).
              type: string
              examples:
                - agent-0815
            timestamp:
              description: ISO 8601 timestamp of when the evidence was recorded.
              type: string
              format: date-time
              examples:
                - '2024-03-15T10:48:03Z'
            videoReference:
              description: URL/reference to the recorded identification session video.
              type: string
              examples:
                - dms://identification/IDV-2024-0042871/video
        biometricVerification:
          description: Results of the biometric verification.
          type: object
          properties:
            documentAuthenticityScore:
              description: Document authenticity confidence based on visual security features.
              type: number
              minimum: 0
              maximum: 1
              examples:
                - 0.97
            faceMatchScore:
              description: Face-to-document match confidence. Minimum threshold typically 0.85.
              type: number
              minimum: 0
              maximum: 1
              examples:
                - 0.93
            livenessScore:
              description: Liveness detection confidence score. Minimum threshold typically 0.9.
              type: number
              minimum: 0
              maximum: 1
              examples:
                - 0.98
            securityFeaturesChecked:
              description: Total number of security features inspected.
              type: number
              examples:
                - 8
            securityFeaturesVerified:
              description: Number of security features that passed verification.
              type: number
              examples:
                - 8
    BackgroundCheck:
      title: Background check
      description: |
        AML and compliance screening of a customer and the resulting compliance decision. Created by the client, performed asynchronously by the
        provider.
      type: object
      required:
        - backgroundCheckId
        - complianceStatus
        - requestedAt
      properties:
        backgroundCheckId:
          description: Unique identifier of the background check, assigned by the provider.
          $ref: '#/components/schemas/Id'
          readOnly: true
        complianceStatus:
          description: Compliance decision. Opening an account requires the most recent background check of the customer to be approved.
          type: string
          enum:
            - approved
            - rejected
            - pending
            - manual_review
          examples:
            - approved
        requestedAt:
          description: ISO 8601 timestamp of when the background check was requested.
          type: string
          format: date-time
          examples:
            - '2024-03-15T10:50:00Z'
          readOnly: true
        amlRiskClass:
          description: AML risk classification derived from all check results and profile factors.
          type: string
          enum:
            - low
            - medium
            - high
          examples:
            - low
        checksCompleted:
          description: Results of the individual screening checks.
          type: object
          properties:
            adverseMediaCheck:
              description: Screening of news and media for negative customer coverage.
              type: string
              enum:
                - passed
                - failed
                - pending
              examples:
                - passed
            creditCheck:
              description: Creditworthiness assessment via CRIF, ZEK or equivalent.
              type: string
              enum:
                - passed
                - failed
                - pending
              examples:
                - passed
            crimeCheck:
              description: Criminal background screening result.
              type: string
              enum:
                - passed
                - failed
                - pending
              examples:
                - passed
            pepCheck:
              description: Screening against Politically Exposed Persons databases.
              type: string
              enum:
                - passed
                - failed
                - pending
              examples:
                - passed
            sanctionCheck:
              description: Screening against UN, EU, OFAC, SECO sanctions lists.
              type: string
              enum:
                - passed
                - failed
                - pending
              examples:
                - passed
        completedAt:
          description: ISO 8601 timestamp of when the provider completed the background check.
          type: string
          format: date-time
          examples:
            - '2024-03-15T10:55:00Z'
          readOnly: true
        pepDetails:
          description: Details of the Politically Exposed Person (PEP) screening.
          type: object
          properties:
            lastChecked:
              description: Timestamp of most recent PEP screening. Must be refreshed periodically.
              type: string
              format: date-time
              examples:
                - '2024-03-15T10:05:00Z'
            pepCategory:
              description: Category of the political exposure, if the customer is a PEP.
              type: string
              enum:
                - head_of_state
                - minister
                - parliament_member
                - senior_military
                - judicial_official
                - central_bank_governor
                - state_enterprise_executive
                - family_member
                - close_associate
              examples:
                - parliament_member
            pepStatus:
              description: Whether the customer is classified as Politically Exposed Person.
              type: string
              enum:
                - 'no'
                - 'yes'
              examples:
                - 'no'
        riskAssessment:
          description: Overall risk assessment of the customer relationship.
          type: object
          properties:
            lastAssessment:
              description: ISO 8601 timestamp of the most recent risk assessment.
              type: string
              format: date-time
              examples:
                - '2024-03-15T10:05:00Z'
            overallRisk:
              description: Overall risk level of the customer relationship.
              type: string
              enum:
                - low
                - medium
                - high
              examples:
                - low
            riskFactors:
              description: Risk factors identified during the assessment.
              type: array
              items:
                type: string
                enum:
                  - high_risk_country
                  - cash_intensive_business
                  - complex_ownership
                  - pep_related
                examples:
                  - high_risk_country
            riskScore:
              description: Numeric risk score where 0 is lowest and 100 is highest risk.
              type: number
              minimum: 0
              maximum: 100
              examples:
                - 12
    Contract:
      title: Contract
      description: Contract document presented to the customer, and its acceptance.
      type: object
      required:
        - accepted
        - contractId
        - contractType
        - version
      properties:
        accepted:
          description: Whether the customer has accepted this contract. Set via the acceptance sub-resource.
          type: boolean
          examples:
            - true
          readOnly: true
        contractId:
          description: Unique identifier for this contract document instance.
          $ref: '#/components/schemas/Id'
          readOnly: true
        contractType:
          description: Type of the contract document.
          type: string
          enum:
            - termsAndConditions
            - dataSharingAgreement
            - baseContract
            - productAgreement
          examples:
            - termsAndConditions
        version:
          description: Version number of the contract (e.g. 2.1, 3.0), assigned by the provider.
          type: string
          examples:
            - '2.1'
          readOnly: true
        acceptanceTimestamp:
          description: ISO 8601 timestamp of when the customer accepted this contract.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:02:45Z'
          readOnly: true
        documentUrl:
          description: Relative URL from which the contract document can be retrieved.
          type: string
          examples:
            - /documents/CTR-2024-000123.pdf
          readOnly: true
        productId:
          description: Product catalog ID this contract applies to. Required for productAgreement only.
          type: string
          examples:
            - PRV-ACC-STD
    ContractAcceptance:
      title: Contract acceptance
      description: Acceptance of a single contract by the customer.
      type: object
      required:
        - acceptanceTimestamp
        - accepted
      properties:
        acceptanceTimestamp:
          description: ISO 8601 timestamp of when the customer accepted the contract.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:02:45Z'
        accepted:
          description: Whether the customer accepts the contract.
          type: boolean
          examples:
            - true
    SignedContract:
      title: Signed contract
      description: Single contract covered by an electronic signature.
      type: object
      required:
        - contractId
        - version
      properties:
        contractId:
          description: Contract covered by the signature.
          $ref: '#/components/schemas/Id'
        version:
          description: Version of the signed contract. Must match the accepted version.
          type: string
          examples:
            - '2.1'
        contractType:
          description: Type of the signed contract.
          type: string
          examples:
            - termsAndConditions
          readOnly: true
        signatureTimestamp:
          description: ISO 8601 timestamp of the signature. Equal to or later than the acceptanceTimestamp of the contract.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:10:00Z'
          readOnly: true
    Signature:
      title: Signature
      description: Electronic signature of one or more accepted contracts.
      type: object
      required:
        - legallyBinding
        - mfaCompleted
        - signatureId
        - signatureStatus
        - signatureType
        - signedContracts
      properties:
        legallyBinding:
          description: Whether the signature is legally binding based on type and applicable jurisdiction. Determined by the provider.
          type: boolean
          examples:
            - true
          readOnly: true
        mfaCompleted:
          description: Whether MFA was completed during signing. Required for QES and AES.
          type: boolean
          examples:
            - true
        signatureId:
          description: Unique identifier of the signature, assigned by the provider.
          $ref: '#/components/schemas/Id'
          readOnly: true
        signatureStatus:
          description: Validation state of the signature. Only a completed signature can be referenced when opening an account.
          type: string
          enum:
            - completed
            - pending
            - failed
          examples:
            - completed
          readOnly: true
        signatureType:
          description: eIDAS signature level. QES requires a QEAA-level identification of the customer.
          type: string
          enum:
            - QES
            - AES
            - SES
          examples:
            - QES
        signedContracts:
          description: Contracts covered by this signature. Every contract must have been accepted by the customer.
          type: array
          items:
            $ref: '#/components/schemas/SignedContract'
        createdAt:
          description: ISO 8601 timestamp of when the signature was recorded.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:10:00Z'
          readOnly: true
        signatureData:
          description: Technical data of the signature.
          type: object
          properties:
            certificate:
              description: X.509 digital certificate (PEM or Base64-encoded DER). For QES, must be from a qualified TSP.
              type: string
              examples:
                - MIIDdzCCAl+gAwIBAgIEAgAAuTANBgkqhkiG9w0BAQUFADBaMQswCQYDVQQGEwJJRTESMBAGA1UEChMJQmFsdGltb3Jl
            deviceInfo:
              description: Device type, OS, browser, and app version used for signing (audit and fraud detection).
              type: string
              examples:
                - iPhone 15; iOS 17.4; Banking App 5.2.1
            timestamp:
              description: Timestamp from a trusted timestamping authority (TSA) providing non-repudiation.
              type: string
              format: date-time
              examples:
                - '2024-03-15T11:10:00Z'
    Account:
      title: Account
      description: Banking account opened for a customer, including the selected products and the references created in the core banking system.
      type: object
      required:
        - accountId
        - accountType
        - productPackage
        - signatureId
        - status
      properties:
        accountId:
          description: Unique identifier of the account, assigned by the provider.
          $ref: '#/components/schemas/Id'
          readOnly: true
        accountType:
          description: Primary account category.
          type: string
          enum:
            - private
            - savings
            - youth
            - business
          examples:
            - private
        productPackage:
          description: Product tier within the selected account type.
          type: string
          enum:
            - standard
            - student
            - youth
            - premium
            - business
          examples:
            - standard
        signatureId:
          description: Completed signature covering the contracts required for the selected products.
          $ref: '#/components/schemas/Id'
        status:
          description: Provisioning state of the account in the core banking system.
          type: string
          enum:
            - pending
            - active
            - rejected
          examples:
            - active
          readOnly: true
        additionalProducts:
          description: Optional add-on product catalog IDs (e.g. credit cards, e-banking modules).
          type: array
          items:
            type: string
            examples:
              - debit-card
              - e-banking
        cardIssuanceStatus:
          description: Card issuance status (e.g. not_requested, requested, in_production, shipped, activated).
          type: string
          examples:
            - requested
          readOnly: true
        createdAt:
          description: ISO 8601 timestamp of when the account opening was requested.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:15:00Z'
          readOnly: true
        documentArchiveReference:
          description: Reference ID or URL to the archived account opening documents in the DMS.
          type: string
          examples:
            - DMS-2024-ONB-000123
          readOnly: true
        iban:
          description: Assigned IBAN in ISO 13616 format. Available once the account is active.
          type: string
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          examples:
            - CH9300762011623852957
          readOnly: true
        monthlyFee:
          description: Recurring monthly fee for the selected product combination.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Amount'
        monthlyFeeCurrency:
          description: ISO 4217 currency code of the monthly fee.
          type: string
          pattern: ^[A-Z]{3}$
          examples:
            - CHF
          readOnly: true
    AuditEvent:
      title: Audit event
      description: Single entry of the audit trail of a customer, recorded by the provider for every change of a resource.
      type: object
      required:
        - action
        - eventId
        - originator
        - resourceId
        - resourceType
        - result
        - timestamp
      properties:
        action:
          description: Machine-readable action identifier (e.g. consent_granted, contract_accepted).
          type: string
          examples:
            - contract_accepted
        eventId:
          description: Unique identifier of the audit event.
          $ref: '#/components/schemas/Id'
        originator:
          description: Entity that performed the action.
          type: string
          enum:
            - user
            - system
            - partner
          examples:
            - user
        resourceId:
          description: Identifier of the resource affected by the action.
          $ref: '#/components/schemas/Id'
        resourceType:
          description: Type of the resource affected by the action.
          type: string
          enum:
            - consent
            - customer
            - selfDeclaration
            - financialProfile
            - identification
            - backgroundCheck
            - contract
            - signature
            - account
          examples:
            - contract
        result:
          description: Outcome of the action.
          type: string
          enum:
            - success
            - failure
            - pending
          examples:
            - success
        timestamp:
          description: ISO 8601 timestamp of when the action was performed.
          type: string
          format: date-time
          examples:
            - '2024-03-15T11:02:45Z'
        correlationId:
          description: X-Correlation-ID of the request that triggered the action.
          type: string
          examples:
            - f058ebd6-02f7-4d3f-942e-904344e8cde5
        deviceFingerprint:
          description: Hash representing the device used. Used for fraud detection.
          type: string
          examples:
            - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        ipAddress:
          description: IP address from which the action was initiated.
          type: string
          examples:
            - 203.0.113.42
  responses:
    standard400:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Bad Request - The format of the request was invalid.

        Examples:
        - InvalidPayload:
        type: /problems/INVALID_PAYLOAD
        title: Payload does not comply with API specification
        detail: Malformed JSON
        instance: path/to/corresponding/resource

        - InvalidParameter:
        type: /problems/INVALID_PAYLOAD
        title: Invalid parameter values have been detected
        detail: The field country must be an ISO 3166-1 alpha-2 country code
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard401:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: Unauthorized - The request has not been applied because it provides no valid authentication credentials for the target resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard403:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Forbidden - A valid OAuth token was received, but access was denied. (Depending on the security requirements, providers can return 404
        instead)

        Examples:
        - InsufficientPrivileges:
        type: /problems/INSUFFICIENT_PRIVILEGES
        title: No privileges for the requested operation
        detail: The token does not grant the scope required for this operation
        instance: path/to/corresponding/resource

        - ExpiredToken:
        type: /problems/EXPIRED_TOKEN
        title: The OAuth token is expired
        detail: The token is no longer valid
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard500:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Internal Server Error - The server encountered an unexpected condition that prevented it from fulfilling the request.

        Examples:
        - TechnicalServerError:
        type: /problems/TECHNICAL_ERROR
        title: Technical error on server side
        detail: Processing yielded a technical error
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard503:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: Service Unavailable - The server is currently unable to handle the request due to a temporary overload or scheduled maintenance.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard404:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Not Found - Either the endpoint does not exist or the requested resource does not exist.

        Examples:
        - ResourceNotFound:
        type: /problems/RESOURCE_NOT_FOUND
        title: Resource not found
        detail: No customer exists for the given customerId
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard409:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Conflict - The request conflicts with the current state of the target resource.

        Examples:
        - ContractAlreadySigned:
        type: /problems/RESOURCE_LOCKED
        title: The resource can no longer be changed
        detail: The contract is covered by a completed signature and cannot be changed
        instance: path/to/corresponding/resource

        - ConsentAlreadyRevoked:
        type: /problems/RESOURCE_LOCKED
        title: The resource can no longer be changed
        detail: The consent has already been revoked
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard422:
      headers:
        Content-Language:
          $ref: '#/components/headers/Content-Language'
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Unprocessable Content - The request is well-formed, but the provider refuses it because it would violate a regulatory or business invariant.
        The invariants enforced by an operation are listed in its description. The type of the problem names the violated invariant.

        Examples:
        - ConsentMissing:
        type: /problems/CONSENT_MISSING
        title: No active consent covers the data
        detail: The consent does not cover the data category financialProfile
        instance: path/to/corresponding/resource

        - PreconditionNotMet:
        type: /problems/PRECONDITION_NOT_MET
        title: A required resource is missing or not in the required state
        detail: The most recent background check of the customer is not approved
        instance: path/to/corresponding/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
  parameters:
    correlation:
      in: header
      name: X-Correlation-ID
      description: Unique ID (defined by the caller) which will be reflected back in the response.
      required: true
      schema:
        type: string
        examples:
          - f058ebd6-02f7-4d3f-942e-904344e8cde5
    idempotency_key:
      in: header
      name: Idempotency-Key
      description: |
        Unique key (defined by the caller) that makes a create request safe to retry. A repeated request with the same key returns the result of the
        original request instead of creating a second resource.
      required: true
      schema:
        type: string
        maxLength: 64
        examples:
          - 5b3c8d7e-1f2a-4c6b-9e0d-3a7f1b2c4d5e
    psu_ip:
      in: header
      name: X-PSU-IP-Address
      description: IP address of the user initiating the operation. Recorded in the audit trail.
      required: false
      schema:
        type: string
        examples:
          - 203.0.113.42
    psu_user_agent:
      in: header
      name: X-PSU-User-Agent
      description: User agent of the client software used by the user. Recorded in the audit trail.
      required: false
      schema:
        type: string
        examples:
          - Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X)
    consent_id:
      in: path
      name: consentId
      description: ID of the consent.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    customer_id:
      in: path
      name: customerId
      description: ID of the customer.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    cursor:
      in: query
      name: cursor
      description: Optional parameter for pagination. Use the X-Next-Cursor header of the previous response to retrieve the next set of results.
      required: false
      schema:
        type: string
        examples:
          - cursorIDxyz
    limit:
      in: query
      name: limit
      description: |
        Optional parameter for pagination, specifying the number of items to return. The actual maximum limit can be defined by the provider.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        examples:
          - 25
        default: 25
    identification_id:
      in: path
      name: identificationId
      description: ID of the identification.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    background_check_id:
      in: path
      name: backgroundCheckId
      description: ID of the background check.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    contract_id:
      in: path
      name: contractId
      description: ID of the contract.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    signature_id:
      in: path
      name: signatureId
      description: ID of the signature.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    account_id:
      in: path
      name: accountId
      description: ID of the account.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    Location:
      description: Location (URI-reference) of the created resource. The relative path shall be returned as URI-reference.
      schema:
        type: string
        examples:
          - /customers/c-7f3a9b2e/contracts/CTR-2024-000123
    X-Correlation-ID:
      description: Client defined ID from request to correlates HTTP requests between a client and server.
      schema:
        type: string
        examples:
          - f058ebd6-02f7-4d3f-942e-904344e8cde5
    Content-Language:
      description: Response language - always en.
      schema:
        type: string
        examples:
          - en
    X-Next-Cursor:
      description: |
        An opaque string value used for pagination. Include this value in the cursor parameter of the subsequent request to fetch the next page of
        results. An empty string indicates that there are no more results.
      required: true
      schema:
        type: string
        examples:
          - nextCursorIDxyz
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth authorization code flow. Further security requirements are defined by the provider.
      flows:
        authorizationCode:
          authorizationUrl: https://onboarding.common-api.ch/oauth/authorize
          tokenUrl: https://onboarding.common-api.ch/oauth/token
          scopes:
            accounts:read: Read the accounts of a customer.
            accounts:write: Open accounts for a customer.
            audit:read: Read the audit trail of a customer.
            consents:read: Read consents.
            consents:write: Create and revoke consents.
            contracts:read: Read contracts and signatures.
            contracts:write: Create, accept and sign contracts.
            customers:read: Read identity, address and contact data of a customer.
            customers:write: Create and change customers.
            kyc:read: Read the KYC data of a customer.
            kyc:write: Submit KYC data and request background checks.
