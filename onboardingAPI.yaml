    post:
      tags:
        - accounts
      summary: Open an account
      description: |
        Opens an account with the selected products for the customer. Provisioning in the core banking system runs asynchronously: the account is
        returned with status pending and can be polled at the returned location until it is active or rejected.

        Invariants (PRECONDITION_NOT_MET unless stated otherwise):
        - The consent of the customer is active and covers the data categories of all resources below (CONSENT_MISSING).
        - The customer has a self declaration.
        - The most recent identification of the customer meets the verification level required for the selected products.
        - The most recent background check of the customer has complianceStatus approved.
        - The customer has a financial profile if a selected product requires a MiFID II suitability assessment.
        - signatureId references a completed, legally binding signature of the customer that covers accepted termsAndConditions, baseContract and a
        productAgreement for each selected product.
      operationId: createAccount
      security:
        - OAuth2:
            - accounts:write
      parameters:
